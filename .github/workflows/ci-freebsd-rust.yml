name: FreeBSD CI (Rust)

on:
  push:
    branches:
      - linux/rust
    paths:
      - 'linux-rust/**'
      - '.github/workflows/ci-freebsd-rust.yml'
  pull_request:
    paths:
      - 'linux-rust/**'
      - '.github/workflows/ci-freebsd-rust.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: |
            pkg install -y rust pkgconf dbus pulseaudio
          run: |
            cd linux-rust
            cargo build --release --locked
            cargo test --locked
